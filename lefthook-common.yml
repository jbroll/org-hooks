# Tier 1 — fast, staged-only, runs on every commit in every repo.
# Consumed via `remotes:` from each repo's lefthook.yml. Keep every
# command sub-second; anything slower belongs in lefthook-push.yml.
#
# Per-repo policy knobs (set in the repo's gitignored lefthook-local.yml
# or the environment):
#   LEFTHOOK_EXCLUDE   - comma list of command names to skip
#   ORG_HOOKS          - absolute path to this repo's checkout (set by stub)

pre-commit:
  parallel: true
  commands:
    secrets:
      # gitleaks >=8.18. Older builds: `gitleaks protect --staged`.
      run: gitleaks git --pre-commit --staged --redact --no-banner
    large-files:
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" large-files {staged_files}'
    conflict-markers:
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" conflict-markers {staged_files}'
    eof-whitespace:
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" eof-ws {staged_files}'

# Linear-history guard: protected branches update by fast-forward merge only
# (no merge commits, no PRs). Fast-forward merges create no commit so they pass;
# a merge commit on a protected branch is rejected.
pre-merge-commit:
  commands:
    no-merge-on-protected:
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" no-merge-commit'
