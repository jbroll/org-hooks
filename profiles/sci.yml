# Simple-CI dispatch profile.
# Include alongside profiles/ts.yml in remotes: configs for repos that
# dispatch test jobs to a simple-ci GPU worker.
#
# Convention:
#   sci binary:  /home/john/src/simple-ci/sci  (override: SCI_BIN in the rc: env)
#   job names:   <repo-dirname>/ci/test , <repo-dirname>/ci/e2e
#                (worktree-aware: derived from the git COMMON dir; override SCI_WT)
#   fallbacks:   npm run test:coverage  /  npm run test:e2e
#
# The dispatch core (SCI/WT resolution, ci/before-test-push, trap-kill on
# interrupt, wait, lcov retrieval from the CI host) is scripts/sci-run.sh; the
# staged-file ratchet filtering is scripts/ratchet-staged.sh. Keep dispatch
# changes THERE — this profile is composition only.
#
# Coverage ratchet: runs inline here — AFTER sci-run.sh has retrieved fresh
# lcov from the CI host — so it always checks data from this exact commit.
# A separate lefthook command would race the test job (no command-level ordering
# survives parallel: true), so ordering is enforced by the shell instead.
#
# Ratchet staged-file filtering defaults (see ratchet-staged.sh):
#   glob:    ^src/.*\.(ts|tsx|js|jsx|mjs|cjs)$
#   exclude: src/test/, __tests__/, *.test.*, *.spec.*
# Per-project additional excludes — one path per line, # comments ignored:
#   coverage-ratchet-exclude     — for unit ratchet
#   coverage-e2e-ratchet-exclude — for E2E ratchet
#
# Override e2e-tests glob in your lefthook.yml to narrow to frontend files only.

pre-commit:
  commands:
    unit-tests:
      glob: "**/*.{ts,tsx,js,jsx,json,css,html}"
      run: |
        LCOV=${COVERAGE_LCOV:-coverage/lcov.info}
        rc=0
        "${ORG_HOOKS}/scripts/sci-run.sh" --label unit --before ci/before-test-push \
          --lcov "$LCOV" --fallback "npm run test:coverage" ci/test || rc=$?
        "${ORG_HOOKS}/scripts/ratchet-staged.sh" --lcov "$LCOV" \
          --baseline "${COVERAGE_BASELINE:-coverage-baseline.json}" \
          --exclude-file coverage-ratchet-exclude || exit 1
        exit $rc
    e2e-tests:
      glob: "**/*.{ts,tsx,js,jsx,json,css,html}"
      run: |
        E2E_LCOV=${COVERAGE_E2E_LCOV:-coverage/e2e/lcov.info}
        rc=0
        "${ORG_HOOKS}/scripts/sci-run.sh" --label e2e \
          --lcov "$E2E_LCOV" --fallback "npm run test:e2e" ci/e2e || rc=$?
        "${ORG_HOOKS}/scripts/ratchet-staged.sh" --lcov "$E2E_LCOV" \
          --baseline "${COVERAGE_E2E_BASELINE:-coverage-e2e-baseline.json}" \
          --exclude-file coverage-e2e-ratchet-exclude \
          --glob '^src/.*\.(ts|tsx)$' || exit 1
        exit $rc
