# Coverage ratchet profile.
#
# When using simple-ci (profiles/sci.yml), the ratchet runs inline inside the
# unit-tests and e2e-tests commands, after lcov is retrieved from the CI host.
# That guarantees the check always uses coverage from this exact commit.
#
# This file documents the ratchet configuration and provides the seed command.
# It does NOT define separate lefthook commands — those would run in parallel
# with the test job and check stale lcov.
#
# Ratchets activate when their baseline file exists and is non-empty:
#
#   unit ratchet:  coverage-baseline.json        (COVERAGE_BASELINE overrides)
#                  coverage/lcov.info             (COVERAGE_LCOV overrides)
#
#   E2E ratchet:   coverage-e2e-baseline.json     (COVERAGE_E2E_BASELINE overrides)
#                  coverage/e2e/lcov.info          (COVERAGE_E2E_LCOV overrides)
#
# COVERAGE_FLOOR (default 0.75) applies to both.
#
# Per-project staged-file excludes (grep -Ev pattern):
#   COVERAGE_RATCHET_EXCLUDE       — extra excludes for unit ratchet
#   COVERAGE_E2E_RATCHET_EXCLUDE   — extra excludes for E2E ratchet
#
# To enable unit ratchet:
#   1. Add 'lcov' to your test runner's coverage reporters.
#   2. Create coverage-baseline.json (empty: {"version":1,"files":{}}).
#   3. The baseline is populated automatically on the first passing run.
#
# To enable E2E ratchet:
#   1. Instrument your Playwright run with V8 coverage producing an lcov.info.
#   2. Create coverage-e2e-baseline.json (empty: {"version":1,"files":{}}).
#
# Force-seed: to accept current lcov as the new baseline after a large refactor:
#   node <ORG_HOOKS>/scripts/coverage-ratchet.mjs --seed \
#     --lcov coverage/lcov.info --baseline coverage-baseline.json
