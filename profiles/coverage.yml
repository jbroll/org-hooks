# Coverage ratchet profile. Opt in by adding profiles/coverage.yml to your
# remotes: configs. Include alongside profiles/sci.yml when using simple-ci.
#
# When sci.yml is also included, these commands are no-ops — sci.yml runs the
# ratchet inline after retrieving fresh lcov from the CI host, which guarantees
# the check runs against current-commit coverage.  These commands activate only
# for repos without sci (i.e. when /home/john/src/simple-ci/sci is not present),
# where npm run test:coverage / test:e2e runs locally and lcov is already on disk
# before the ratchet fires.
#
# Two independent ratchets — opt into each by creating the matching baseline file:
#
#   coverage-ratchet      unit/node ratchet
#     baseline:  coverage-baseline.json        (default; COVERAGE_BASELINE overrides)
#     lcov:      coverage/lcov.info            (default; COVERAGE_LCOV overrides)
#
#   coverage-ratchet-e2e  browser/E2E ratchet
#     baseline:  coverage-e2e-baseline.json    (default; COVERAGE_E2E_BASELINE overrides)
#     lcov:      coverage/e2e/lcov.info        (default; COVERAGE_E2E_LCOV overrides)
#
# Both ratchets are a no-op when their baseline file does not exist or is empty,
# so you can enable them independently.  COVERAGE_FLOOR (default 0.75) applies to both.
#
# To enable unit ratchet:
#   1. Add 'lcov' to your test runner's coverage reporters.
#   2. Create coverage-baseline.json (empty: {"version":1,"files":{}}).
#   3. The baseline is populated automatically on the first passing run.
#
# To enable E2E ratchet:
#   1. Instrument your Playwright run with V8 coverage producing an lcov.info.
#   2. Create coverage-e2e-baseline.json (empty: {"version":1,"files":{}}).
#
# Force-seed: to accept current lcov as the new baseline after a large refactor:
#   node <ORG_HOOKS>/scripts/coverage-ratchet.mjs --seed \
#     --lcov coverage/lcov.info --baseline coverage-baseline.json

pre-commit:
  commands:
    coverage-ratchet:
      depends_on: [unit-tests]
      glob: "src/**/*.{ts,tsx,js,jsx,mjs,cjs}"
      run: |
        # sci.yml handles this inline after lcov retrieval — skip here to avoid
        # checking stale lcov in parallel with the unit-tests command.
        SCI=/home/john/src/simple-ci/sci
        if test -x "$SCI"; then exit 0; fi
        LCOV=${COVERAGE_LCOV:-coverage/lcov.info}
        BASELINE=${COVERAGE_BASELINE:-coverage-baseline.json}
        if [ ! -f "$BASELINE" ]; then exit 0; fi
        if [ ! -f "$LCOV" ]; then exit 0; fi
        node "${ORG_HOOKS}/scripts/coverage-ratchet.mjs" \
          --lcov "$LCOV" \
          --baseline "$BASELINE" \
          {staged_files}

    coverage-ratchet-e2e:
      depends_on: [e2e-tests]
      glob: "src/**/*.{ts,tsx,js,jsx,mjs,cjs}"
      run: |
        # sci.yml handles this inline after lcov retrieval — skip here to avoid
        # checking stale lcov in parallel with the e2e-tests command.
        SCI=/home/john/src/simple-ci/sci
        if test -x "$SCI"; then exit 0; fi
        LCOV=${COVERAGE_E2E_LCOV:-coverage/e2e/lcov.info}
        BASELINE=${COVERAGE_E2E_BASELINE:-coverage-e2e-baseline.json}
        if [ ! -f "$BASELINE" ]; then exit 0; fi
        if [ ! -f "$LCOV" ]; then exit 0; fi
        node "${ORG_HOOKS}/scripts/coverage-ratchet.mjs" \
          --lcov "$LCOV" \
          --baseline "$BASELINE" \
          {staged_files}
