# Tiered, fail-fast pre-commit gate — ZERO consumer overrides.
#
# A consumer pulls ONLY this one file in remotes:.configs and adds NO
# pre-commit block of its own. Everything — every static check, the GPU
# dispatch, the coverage ratchet, the globs, the CI queue name — is defined
# here. The consumer's lefthook.yml is just `remotes:` + `rc:`.
#
# ── WHY ZERO OVERRIDES (and why this file is self-contained) ──────────────────
#   Cross-config merge in lefthook 2.1.6 is treacherous and was the source of
#   every prior breakage. Verified facts:
#     • A hook can't mix `commands:` and `jobs:` — if both appear, commands win
#       and jobs are ignored. Tiering REQUIRES `jobs:`, so EVERY check is a job.
#     • A top-level `jobs:` list runs sequentially but is NOT fail-fast — a
#       failed job does not stop the next. Neither does `parallel: false`.
#       The ONLY setting that stops on first failure is `piped: true`.
#     • When a consumer adds its own `pre-commit:` block, lefthook DROPS the
#       remote hook's top-level `piped: true` — silently killing fail-fast.
#     • A consumer override does NOT deep-merge into a remote nested job's
#       run/glob; and a second override layer leaks nested jobs to the top
#       level and breaks gating.
#   The robust fix for ALL of the above is to have NOTHING to merge: the
#   consumer declares no pre-commit jobs, so `piped: true` and the tier tree
#   below are used verbatim. Tunable bits are exposed as ENV VARS (read at run
#   time, sourced from the consumer's rc:) instead of config overrides.
#
# ── STRUCTURE ─────────────────────────────────────────────────────────────────
#   pre-commit (piped: true)
#     1. tier1-static — group(parallel: true): 12 fast local checks. All run
#        even if one fails (so you see every problem), but the GROUP's exit is
#        nonzero if any failed, which breaks the pipe.
#     2. tier2-gpu    — group(parallel: true): unit-tests + e2e-tests sci
#        dispatch. Runs ONLY if tier1-static fully passed. A 0.02s lint/type
#        failure therefore never dispatches (or waits on) a ~2-min GPU job.
#
# ── ENV KNOBS (export from the consumer's rc: file; all optional) ─────────────
#   ORG_HOOKS        REQUIRED — absolute path to this org-hooks checkout.
#   SCI_WT           Override the CI queue name. NOT needed: the queue is
#                    derived from the git COMMON dir (see WT= below), so every
#                    worktree of a repo resolves to the repo's own dir name.
#   DPDM_CIRCULAR    dpdm --exit-code policy for ts-circular. Default
#                    "circular:1" (a cycle fails the commit). A repo with
#                    pre-existing cycles through barrels exports "circular:0"
#                    (warn-only) from its rc: until the cycles are cleaned up.
#   SCI_BIN          Path to the simple-ci binary (default below). Falls back
#                    to `npm run test:coverage` / `test:e2e` if not executable.
#   COVERAGE_* / COVERAGE_E2E_*  ratchet lcov/baseline/floor/tolerance paths.
#
# Required npm scripts in the consumer: type-check, knip, and (for the sci
# fallback path) test:coverage, test:e2e.

pre-commit:
  # Fail-fast across tiers: any tier1 failure breaks the pipe → tier2 skipped.
  # This is the ONLY mechanism that gates tier2 behind tier1 (verified 2.1.6).
  piped: true
  jobs:
    # ── Tier 1 — fast, local, parallel. All must pass before Tier 2. ─────────
    - name: tier1-static
      group:
        parallel: true
        jobs:
          # hygiene + secrets
          - name: secrets
            run: gitleaks git --pre-commit --staged --redact --no-banner
          - name: large-files
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" large-files {staged_files}'
          - name: conflict-markers
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" conflict-markers {staged_files}'
          - name: eof-whitespace
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" eof-ws {staged_files}'
          # TypeScript static analysis
          - name: ts-format-lint
            glob: "*.{ts,tsx,js,jsx,mjs,cjs,json}"
            run: npx --no-install biome check --staged --no-errors-on-unmatched
          - name: ts-typecheck
            glob: "*.{ts,tsx,json}"
            run: npm run type-check
          - name: ts-deadcode
            glob: "*.{ts,tsx,json}"
            run: npm run knip
          # ts-circular: exit policy is the DPDM_CIRCULAR env var (default
          # strict). A repo with known cycles relaxes it WITHOUT touching config
          # by exporting DPDM_CIRCULAR=circular:0 from its rc: file.
          - name: ts-circular
            glob: "*.{ts,tsx}"
            run: >-
              npx --no-install dpdm --no-warning --no-tree
              --exit-code "${DPDM_CIRCULAR:-circular:1}" "src/**/*.{ts,tsx}"
          - name: ts-dup-types
            glob: "*.{ts,tsx}"
            run: node "${ORG_HOOKS}/scripts/check-duplicate-types.mjs" src
          - name: ts-no-reexports
            glob: "*.{ts,tsx,js,jsx,mjs}"
            run: node "${ORG_HOOKS}/scripts/check-no-reexports.mjs" src
          - name: ts-size-cap
            glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" size-cap {staged_files}'
          - name: ts-test-size-cap
            glob: "*.{test,spec}.{ts,tsx,js,jsx}"
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" test-size-cap {staged_files}'

    # ── Tier 2 — expensive GPU dispatch. Runs ONLY if Tier 1 fully passed. ───
    - name: tier2-gpu
      group:
        parallel: true
        jobs:
          # Globs are baked in here as sensible defaults so the consumer needs
          # NO override. unit-tests fires for any source/test change that could
          # move coverage; e2e-tests is narrowed to frontend source ({src,
          # packages,ci}) so backend/scripts-only commits skip the browser
          # suite. lefthook globs are static config (they can't read env), so a
          # repo needing different scoping changes them here, not via a config
          # override that would re-break the merge invariants above.
          - name: unit-tests
            glob: "{src,packages,backend,scripts,ci}/**/*.{ts,tsx,js,jsx,mjs,cjs,json,css}"
            run: |
              SCI=${SCI_BIN:-/home/john/src/simple-ci/sci}
              # CI queue name = the repo's own dir, derived from the git COMMON
              # dir so EVERY worktree (and the main checkout) resolves to the
              # same queue. No SCI_WT override needed. --git-common-dir is the
              # shared .git (absolute here); its parent dir's basename is the repo.
              WT=${SCI_WT:-$(basename "$(cd "$(dirname "$(git rev-parse --git-common-dir)")" && pwd)")}
              if test -x "$SCI"; then
                # Let the repo prepare per-commit inputs (e.g. a changed-files
                # manifest to scope the test run) before the job is rsynced.
                [ -x ci/before-test-push ] && ci/before-test-push
                job=$("$SCI" push "${WT}/ci/test") || exit 1
                echo "  unit queued ($job)"
                # If the commit is interrupted, kill the remote job immediately.
                trap '"$SCI" kill "$job" >/dev/null 2>&1 || true' INT TERM
                "$SCI" wait "$job"; rc=$?
                trap - INT TERM
                # Retrieve fresh lcov from the CI host before the ratchet so it
                # always checks coverage from THIS commit.
                LCOV=${COVERAGE_LCOV:-coverage/lcov.info}
                if ci_host=$("$SCI" host 2>/dev/null) && [ -n "$ci_host" ]; then
                  worktree=$("$SCI" path "$job" 2>/dev/null)
                  if [ -n "$worktree" ]; then
                    mkdir -p "$(dirname "$LCOV")"
                    scp -q "$ci_host:$worktree/$LCOV" "$LCOV" 2>/dev/null || true
                  fi
                fi
                # Run coverage ratchet inline against the just-retrieved lcov.
                BASELINE=${COVERAGE_BASELINE:-coverage-baseline.json}
                if [ -f "$BASELINE" ] && [ -f "$LCOV" ] && [ -n "${ORG_HOOKS:-}" ]; then
                  staged=$(git diff --cached --name-only --diff-filter=ACMR \
                    | grep -E '^src/.*\.(ts|tsx|js|jsx|mjs|cjs)$' \
                    | grep -Ev '(^src/test/|\.(test|spec)\.(ts|tsx|js|jsx|mjs|cjs)$)')
                  if [ -f "coverage-ratchet-exclude" ]; then
                    _excl=$(mktemp)
                    grep -v '^#' coverage-ratchet-exclude | grep -v '^[[:space:]]*$' > "$_excl"
                    staged=$(printf '%s\n' "$staged" | grep -vFf "$_excl")
                    rm -f "$_excl"
                  fi
                  if [ -n "$staged" ]; then
                    node "${ORG_HOOKS}/scripts/coverage-ratchet.mjs" \
                      --lcov "$LCOV" --baseline "$BASELINE" $staged || exit 1
                  fi
                fi
                exit $rc
              else
                npm run test:coverage
              fi
          - name: e2e-tests
            glob: "{src,packages,ci}/**/*.{ts,tsx,mjs,cjs,css}"
            run: |
              SCI=${SCI_BIN:-/home/john/src/simple-ci/sci}
              WT=${SCI_WT:-$(basename "$(cd "$(dirname "$(git rev-parse --git-common-dir)")" && pwd)")}
              if test -x "$SCI"; then
                job=$("$SCI" push "${WT}/ci/e2e-smoke") || exit 1
                echo "  e2e  queued ($job)"
                trap '"$SCI" kill "$job" >/dev/null 2>&1 || true' INT TERM
                "$SCI" wait "$job"; rc=$?
                trap - INT TERM
                # Retrieve fresh E2E lcov from the CI host before the ratchet.
                E2E_LCOV=${COVERAGE_E2E_LCOV:-coverage/e2e/lcov.info}
                if ci_host=$("$SCI" host 2>/dev/null) && [ -n "$ci_host" ]; then
                  worktree=$("$SCI" path "$job" 2>/dev/null)
                  if [ -n "$worktree" ]; then
                    mkdir -p "$(dirname "$E2E_LCOV")"
                    scp -q "$ci_host:$worktree/$E2E_LCOV" "$E2E_LCOV" 2>/dev/null || true
                  fi
                fi
                # Run E2E coverage ratchet inline against the just-retrieved lcov.
                E2E_BASELINE=${COVERAGE_E2E_BASELINE:-coverage-e2e-baseline.json}
                if [ -f "$E2E_BASELINE" ] && [ -f "$E2E_LCOV" ] && [ -n "${ORG_HOOKS:-}" ]; then
                  staged=$(git diff --cached --name-only --diff-filter=ACMR \
                    | grep -E '^src/.*\.(ts|tsx)$' \
                    | grep -Ev '(^src/test/|\.(test|spec)\.(ts|tsx)$)')
                  if [ -f "coverage-e2e-ratchet-exclude" ]; then
                    _excl=$(mktemp)
                    grep -v '^#' coverage-e2e-ratchet-exclude | grep -v '^[[:space:]]*$' > "$_excl"
                    staged=$(printf '%s\n' "$staged" | grep -vFf "$_excl")
                    rm -f "$_excl"
                  fi
                  if [ -n "$staged" ]; then
                    node "${ORG_HOOKS}/scripts/coverage-ratchet.mjs" \
                      --lcov "$E2E_LCOV" --baseline "$E2E_BASELINE" $staged || exit 1
                  fi
                fi
                exit $rc
              else
                npm run test:e2e
              fi

# Linear-history guard. Authoritative enforcement is server-side (GitHub
# Ruleset "require linear history"); this is fast local feedback. Kept here so
# a tiered repo needs only this one file.
pre-merge-commit:
  commands:
    no-merge-on-protected:
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" no-merge-commit'
