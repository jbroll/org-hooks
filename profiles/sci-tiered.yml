# Tiered, fail-fast pre-commit gate — ZERO consumer overrides.
#
# A consumer pulls ONLY this one file in remotes:.configs and adds NO
# pre-commit block of its own. Everything — every static check, the GPU
# dispatch, the coverage ratchet, the globs, the CI queue name — is defined
# here. The consumer's lefthook.yml is just `remotes:` + `rc:`.
#
# ── WHY ZERO OVERRIDES (and why this file is self-contained) ──────────────────
#   Cross-config merge in lefthook 2.1.6 is treacherous and was the source of
#   every prior breakage. Verified facts:
#     • A hook can't mix `commands:` and `jobs:` — if both appear, commands win
#       and jobs are ignored. Tiering REQUIRES `jobs:`, so EVERY check is a job.
#     • A top-level `jobs:` list runs sequentially but is NOT fail-fast — a
#       failed job does not stop the next. Neither does `parallel: false`.
#       The ONLY setting that stops on first failure is `piped: true`.
#     • When a consumer adds its own `pre-commit:` block, lefthook DROPS the
#       remote hook's top-level `piped: true` — silently killing fail-fast.
#     • A consumer override does NOT deep-merge into a remote nested job's
#       run/glob; and a second override layer leaks nested jobs to the top
#       level and breaks gating.
#   The robust fix for ALL of the above is to have NOTHING to merge: the
#   consumer declares no pre-commit jobs, so `piped: true` and the tier tree
#   below are used verbatim. Tunable bits are exposed as ENV VARS (read at run
#   time, sourced from the consumer's rc:) instead of config overrides.
#
# ── STRUCTURE ─────────────────────────────────────────────────────────────────
#   pre-commit (piped: true)
#     1. tier1-instant — group(parallel: true): sub-second local checks (secrets,
#        hygiene, format-lint, dup-types, no-reexports, size-caps). Runs FIRST so
#        a cheap violation fails in <1s instead of waiting out typecheck/knip/dpdm.
#     2. tier1-static  — group(parallel: true): the slow local static analysis
#        (typecheck, knip, dpdm circular; mypy/vulture/deptry/pytest; detekt).
#        Runs only if tier1-instant passed.
#     3. tier2-gpu     — group(parallel: true): a single coverage-union job that
#        sci-dispatches BOTH the unit and e2e GPU runs in parallel, then merges
#        their lcovs per-line and runs ONE union ratchet. Runs ONLY if both local
#        tiers fully passed. A 0.02s lint/type failure therefore never dispatches
#        (or waits on) a ~2-min GPU job.
#   Each group runs all its jobs even if one fails (so you see every problem in
#   that tier), but a nonzero group exit breaks the pipe → later tiers skipped.
#
# ── ENV KNOBS (export from the consumer's rc: file; all optional) ─────────────
#   ORG_HOOKS        REQUIRED — absolute path to this org-hooks checkout.
#   SCI_WT           Override the CI queue name. NOT needed: the queue is
#                    derived from the git COMMON dir (see WT= below), so every
#                    worktree of a repo resolves to the repo's own dir name.
#   DPDM_CIRCULAR    dpdm --exit-code policy for ts-circular. Default
#                    "circular:1" (a cycle fails the commit). A repo with
#                    pre-existing cycles through barrels exports "circular:0"
#                    (warn-only) from its rc: until the cycles are cleaned up.
#   SCI_BIN          Path to the simple-ci binary (default below). Falls back
#                    to `npm run test:coverage` / `test:e2e` if not executable.
#   COVERAGE_* / COVERAGE_E2E_*  ratchet lcov/baseline/floor/tolerance paths.
#   LEFTHOOK_OUTPUT  lefthook's printed sections. Defaulted to
#                    "summary,failure,execution_info" by rc.sh (sourced from the
#                    consumer rc:) so passing commands stay quiet and a failure
#                    isn't buried. CANNOT be set here — lefthook 2.1.x doesn't
#                    merge top-level `output` from a remote config; it must come
#                    from the rc env. A repo overrides by exporting its own
#                    before `. "$ORG_HOOKS/rc.sh"`.
#
# Required npm scripts in the consumer: type-check, knip, and (for the sci
# fallback path) test:coverage, test:e2e.
#
# All three language packs are folded in and glob-gated, so a repo gets the
# checks for the languages it actually has. Host tools: gitleaks, biome (npx),
# ruff, uv, ktlint, detekt. A Python project pins mypy and pytest in its own dev
# group — they run from the project env, not an isolated `uv tool run`, so
# third-party imports type-check and the suite sees its dependencies. Kotlin
# compile/test are still absent: they need Gradle and, for Android, the SDK, so
# they belong in a build-host dispatch alongside tier2 rather than in a local
# tier.

pre-commit:
  # Fail-fast across tiers: any tier1 failure breaks the pipe → tier2 skipped.
  # This is the ONLY mechanism that gates tier2 behind tier1 (verified 2.1.6).
  piped: true
  jobs:
    # ── Tier 0 — staged-tree gate. The GPU test job rsyncs the WORKING TREE,
    #    but the commit captures only STAGED files; refuse anything not staged so
    #    the gate tests exactly what lands. Sub-ms — runs FIRST (fail-fast) and
    #    before tier1-instant's ts-format-lint stage_fixed restage, so it can't
    #    race that re-stage. ───────────────────────────────────────────────────
    - name: fully-staged
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" fully-staged'
    # ── Tier 1a — INSTANT, local, parallel. Sub-second checks; all must pass
    #    before the slower Tier 1b runs, so a cheap violation (re-export,
    #    conflict marker, dup type, oversized file) fails in <1s instead of
    #    waiting out typecheck/knip/dpdm. ──────────────────────────────────────
    - name: tier1-instant
      group:
        parallel: true
        jobs:
          # hygiene + secrets
          - name: secrets
            run: gitleaks git --pre-commit --staged --redact --no-banner
          - name: large-files
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" large-files {staged_files}'
          - name: conflict-markers
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" conflict-markers {staged_files}'
          - name: eof-whitespace
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" eof-ws {staged_files}'
          # Auto-fix + re-stage (matches profiles/ts.yml v0.7.4): formatting
          # self-heals at commit instead of failing the gate. A reformatted file
          # is re-staged via stage_fixed; only --unsafe-needing fixes still fail.
          - name: ts-format-lint
            glob: "*.{ts,tsx,js,jsx,mjs,cjs,json}"
            run: npx --no-install biome check --write --no-errors-on-unmatched {staged_files}
            stage_fixed: true
          - name: ts-dup-types
            glob: "*.{ts,tsx}"
            run: node "${ORG_HOOKS}/scripts/check-duplicate-types.mjs" src 'packages/*/src'
          - name: ts-no-reexports
            glob: "*.{ts,tsx,js,jsx,mjs}"
            run: node "${ORG_HOOKS}/scripts/check-no-reexports.mjs" src 'packages/*/src'
          - name: ts-jazz-waist
            glob: "*.{ts,tsx,js,jsx,mjs}"
            run: node "${ORG_HOOKS}/scripts/check-jazz-value-import-ban.mjs" src backend/src 'packages/*/src'
          - name: ts-size-cap
            glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" size-cap {staged_files}'
          - name: ts-test-size-cap
            glob: "*.{test,spec}.{ts,tsx,js,jsx}"
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" test-size-cap {staged_files}'
          # Python format+lint+hygiene (glob-gated: inert in repos with no .py).
          # Host tool ruff; mypy/vulture/deptry/pytest are in tier1-static below.
          # Mirrors profiles/python.yml, except that the whole-project tools run
          # per Python project via scripts/py-run.sh instead of at the repo root —
          # in a polyglot repo the pyproject.toml sits in a subdirectory. ruff
          # needs no such help: it resolves config from each file's own path.
          - name: py-format-lint
            glob: "*.py"
            run: >-
              ruff check --fix --no-cache {staged_files}
              && ruff format {staged_files}
            stage_fixed: true
          - name: py-size-cap
            glob: "*.py"
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" size-cap {staged_files}'
          - name: py-test-size-cap
            glob: "*.py"
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" test-size-cap {staged_files}'
          # Kotlin format+lint+hygiene (glob-gated: inert in repos with no .kt).
          # Host tools ktlint/detekt (JDK 17+); detekt is in tier1-static below.
          # Mirrors profiles/kotlin.yml. Gradle compile/test needs the SDK → stays
          # in the consumer lefthook / build-host dispatch, not here.
          - name: kt-format-lint
            glob: "*.{kt,kts}"
            run: ktlint --format --relative {staged_files}
            stage_fixed: true
          - name: kt-size-cap
            glob: "*.{kt,kts}"
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" size-cap {staged_files}'
          - name: kt-test-size-cap
            glob: "*Test.kt"
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" test-size-cap {staged_files}'

    # ── Tier 1b — SLOW static analysis, local, parallel. Runs only if Tier 1a
    #    passed; gates Tier 2. ─────────────────────────────────────────────────
    - name: tier1-static
      group:
        parallel: true
        jobs:
          - name: ts-typecheck
            glob: "*.{ts,tsx,json}"
            run: npm run type-check
          - name: ts-deadcode
            glob: "*.{ts,tsx,json}"
            run: npm run knip
          # ts-circular: exit policy is the DPDM_CIRCULAR env var (default
          # strict). A repo with known cycles relaxes it WITHOUT touching config
          # by exporting DPDM_CIRCULAR=circular:0 from its rc: file.
          - name: ts-circular
            glob: "*.{ts,tsx}"
            run: >-
              npx --no-install dpdm --no-warning --no-tree
              --exit-code "${DPDM_CIRCULAR:-circular:1}" "src/**/*.{ts,tsx}" "packages/*/src/**/*.{ts,tsx}"
          # Python whole-project analysis, each run at its own project root by
          # py-run.sh. mypy and pytest come from the project's own env (`uv run`),
          # so a repo pins them in its dev group and controls strictness in
          # pyproject.toml; vulture and deptry need no project deps and run via
          # `uv tool run`. py-test lives here rather than in tier2 because a
          # Python suite runs locally in about a second — there is nothing to
          # dispatch, and a red suite should gate the GPU tier like everything
          # else in tier 1.
          - name: py-typecheck
            glob: "*.py"
            run: '"${ORG_HOOKS}/scripts/py-run.sh" "uv run mypy" {staged_files}'
          - name: py-deadcode
            glob: "*.py"
            run: '"${ORG_HOOKS}/scripts/py-run.sh" "uv tool run vulture . --min-confidence 80" {staged_files}'
          - name: py-deps
            glob: "*.{py,toml}"
            run: '"${ORG_HOOKS}/scripts/py-run.sh" "uv tool run deptry ." {staged_files}'
          - name: py-circular
            glob: "*.py"
            run: >-
              "${ORG_HOOKS}/scripts/py-run.sh"
              'if [ -f .importlinter ] || grep -qs "^\[tool\.importlinter" pyproject.toml; then uv tool run --from import-linter lint-imports; else echo "py-circular: no import-linter contract; skipping"; fi'
              {staged_files}
          - name: py-test
            glob: "*.py"
            run: '"${ORG_HOOKS}/scripts/py-run.sh" "uv run pytest -q" {staged_files}'
          # Kotlin AST static analysis (detekt). Glob-gated: inert with no .kt.
          # --build-upon-default-config means a repo's optional detekt.yml only
          # overrides defaults; with none it runs pure defaults (zero-config-safe).
          - name: kt-static
            glob: "*.{kt,kts}"
            run: >-
              detekt --build-upon-default-config --input .
              --excludes "**/node_modules/**,**/dist/**,**/build/**,**/.gradle/**,**/generated/**"
              $([ -f detekt.yml ] && printf -- "--config detekt.yml")

    # ── Tier 2 — expensive GPU dispatch. Runs ONLY if Tier 1 fully passed. ───
    - name: tier2-gpu
      group:
        parallel: true
        jobs:
          # Single union-coverage orchestrator. Pushes BOTH GPU jobs (they run
          # in parallel on the GPU) and waits FAIL-FAST: the instant either job
          # fails it kills the sibling and fails the commit, so the developer
          # gets the failure as soon as the first job fails rather than after the
          # slowest finishes. Only when BOTH pass does it scp both lcovs, merge
          # them per-line (covered = unit OR e2e), and run ONE ratchet against
          # coverage-union-baseline.json minus coverage-union-ratchet-exclude.
          # Wall-clock for a green commit stays ~max(unit, e2e); for a red one it
          # is ~min(time-to-first-failure). The glob is the union of the old unit
          # + e2e globs. lefthook globs are static config (they can't read env),
          # so a repo needing different scoping changes them here.
          - name: coverage-union
            glob: "{src,packages,backend,scripts,ci}/**/*.{ts,tsx,js,jsx,mjs,cjs,json,css}"
            run: |
              SCI=${SCI_BIN:-/home/john/src/simple-ci/sci}
              WT=${SCI_WT:-$(basename "$(cd "$(dirname "$(git rev-parse --git-common-dir)")" && pwd)")}
              if test -x "$SCI"; then
                [ -x ci/before-test-push ] && ci/before-test-push
                job_u=$("$SCI" push "${WT}/ci/test") || exit 1
                echo "  unit queued ($job_u)"
                job_e=$("$SCI" push "${WT}/ci/e2e") || exit 1
                echo "  e2e  queued ($job_e)"
                trap '"$SCI" kill "$job_u" >/dev/null 2>&1; "$SCI" kill "$job_e" >/dev/null 2>&1; true' INT TERM
                # Fail-fast wait: background a waiter per job recording its exit
                # code; the instant EITHER fails, kill the sibling and exit — no
                # point waiting out the slower job or computing union coverage
                # when a suite already failed. Only when BOTH pass do we merge +
                # ratchet. This gives the developer the failure as soon as the
                # FIRST job fails, not after the slowest one finishes.
                st=$(mktemp -d)
                ( "$SCI" wait "$job_u" >"$st/u.log" 2>&1; echo $? >"$st/u.rc" ) &
                ( "$SCI" wait "$job_e" >"$st/e.log" 2>&1; echo $? >"$st/e.rc" ) &
                rc_u=""; rc_e=""
                while : ; do
                  [ -z "$rc_u" ] && [ -f "$st/u.rc" ] && rc_u=$(cat "$st/u.rc")
                  [ -z "$rc_e" ] && [ -f "$st/e.rc" ] && rc_e=$(cat "$st/e.rc")
                  if [ -n "$rc_u" ] && [ "$rc_u" -ne 0 ]; then
                    "$SCI" kill "$job_e" >/dev/null 2>&1 || true
                    trap - INT TERM; cat "$st/u.log"
                    echo "  unit FAILED ($rc_u) — failing fast, killed e2e ($job_e)"
                    rm -rf "$st"; exit "$rc_u"
                  fi
                  if [ -n "$rc_e" ] && [ "$rc_e" -ne 0 ]; then
                    "$SCI" kill "$job_u" >/dev/null 2>&1 || true
                    trap - INT TERM; cat "$st/e.log"
                    echo "  e2e FAILED ($rc_e) — failing fast, killed unit ($job_u)"
                    rm -rf "$st"; exit "$rc_e"
                  fi
                  [ -n "$rc_u" ] && [ -n "$rc_e" ] && break
                  sleep 3
                done
                trap - INT TERM
                cat "$st/u.log" "$st/e.log"; rm -rf "$st"
                # Both suites passed — retrieve lcovs, merge, and ratchet.

                LCOV=${COVERAGE_LCOV:-coverage/lcov.info}
                E2E_LCOV=${COVERAGE_E2E_LCOV:-coverage/e2e/lcov.info}
                # Full-run e2e lcov persisted on the CI host by ci/e2e-map. WT is
                # the repo name (== CI_REPO on the host, since push targets are
                # ${WT}/ci/...), so it keys the same ~/ci-flake/<repo>-* path.
                E2E_BASELINE_LCOV=${COVERAGE_E2E_BASELINE_LCOV:-coverage/e2e-fullrun/lcov.info}
                if ci_host=$("$SCI" host 2>/dev/null) && [ -n "$ci_host" ]; then
                  wt_u=$("$SCI" path "$job_u" 2>/dev/null)
                  wt_e=$("$SCI" path "$job_e" 2>/dev/null)
                  [ -n "$wt_u" ] && { mkdir -p "$(dirname "$LCOV")"; scp -q "$ci_host:$wt_u/$LCOV" "$LCOV" 2>/dev/null || true; }
                  [ -n "$wt_e" ] && { mkdir -p "$(dirname "$E2E_LCOV")"; scp -q "$ci_host:$wt_e/$E2E_LCOV" "$E2E_LCOV" 2>/dev/null || true; }
                  # ssh+cat (not scp): OpenSSH 9+ scp uses SFTP, which does NOT
                  # shell-expand the remote $HOME; cat over ssh does. Missing file
                  # -> empty output -> merge treats it as no-op (graceful degrade).
                  mkdir -p "$(dirname "$E2E_BASELINE_LCOV")"; ssh "$ci_host" "cat \$HOME/ci-flake/${WT}-e2e-fullrun.lcov" > "$E2E_BASELINE_LCOV" 2>/dev/null || true
                  # Commit the baseline was measured on. Lets the merge remap the
                  # baseline's line numbers onto current source (git diff), so a
                  # line-shifting edit since then stays coverage-neutral. Missing
                  # -> empty -> merge uses raw line numbers (prior behaviour).
                  E2E_BASELINE_SHA=$(ssh "$ci_host" "cat \$HOME/ci-flake/${WT}-e2e-fullrun.sha" 2>/dev/null | tr -d '[:space:]' || true)
                fi

                UNION_LCOV=${COVERAGE_UNION_LCOV:-coverage/union/lcov.info}
                UNION_BASELINE=${COVERAGE_UNION_BASELINE:-coverage-union-baseline.json}
                if [ -n "${ORG_HOOKS:-}" ] && { [ -f "$LCOV" ] || [ -f "$E2E_LCOV" ]; }; then
                  node "${ORG_HOOKS}/scripts/coverage-union-merge.mjs" \
                    --unit "$LCOV" --e2e "$E2E_LCOV" --e2e-baseline "$E2E_BASELINE_LCOV" \
                    ${E2E_BASELINE_SHA:+--e2e-baseline-sha "$E2E_BASELINE_SHA"} \
                    --out "$UNION_LCOV" --src-root src || exit 1
                fi
                "${ORG_HOOKS}/scripts/ratchet-staged.sh" --lcov "$UNION_LCOV" \
                  --baseline "$UNION_BASELINE" \
                  --exclude-file coverage-union-ratchet-exclude \
                  --glob '^(src|packages)/.*\.(ts|tsx|js|jsx|mjs|cjs)$' || exit 1
                exit 0
              else
                npm run test:coverage && npm run test:e2e
              fi

# Linear-history guard: protected branches update by fast-forward merge only
# (no merge commits, no PRs). Fast-forward merges create no commit so they pass;
# a merge commit on a protected branch is rejected. Kept here so a tiered repo
# needs only this one file.
pre-merge-commit:
  commands:
    no-merge-on-protected:
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" no-merge-commit'
