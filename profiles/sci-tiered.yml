# Tiered, fail-fast pre-commit gate (single-file, sci-dispatch repos).
#
# WHY A SEPARATE FILE — and why everything lives here:
#   A working two-tier fail-fast gate can't be split across config files or mix
#   `commands:` and `jobs:`. Verified on lefthook 2.1.6:
#     • lefthook can't gate a flat `commands:` block behind a `jobs:` tree —
#       commands run as their own parallel pool alongside the jobs, outside
#       the tier order.
#     • Same-named groups defined across different config files don't deep-merge
#       cleanly.
#   So EVERY check is defined in this one file's `jobs:` tree.
#
#   The modular packs (lefthook-common.yml, profiles/ts.yml, profiles/sci.yml)
#   are left intact for repos that prefer the flat `parallel: true` commands
#   style. A repo wanting tiered fail-fast pulls ONLY this file — it does NOT
#   also pull profiles/ts.yml etc. (all of those checks are inlined here).
#
# STRUCTURE — fail-fast is `piped: true`, NOT plain sequential:
#   IMPORTANT (verified on lefthook 2.1.6): a top-level `jobs:` list runs its
#   entries sequentially BUT is NOT fail-fast — a failed job does not stop the
#   next one. Neither does `parallel: false`. The ONLY top-level setting that
#   stops the run on first failure is `piped: true` ("broken pipe → skip rest").
#   So this hook sets `piped: true`:
#     1. tier1-static — all fast local static/hygiene checks (inner group is
#        `parallel: true`, so they run concurrently; all run even if one fails).
#     2. tier2-gpu    — expensive simple-ci unit + e2e dispatch (also parallel).
#   tier2-gpu runs ONLY if EVERY tier1-static job passed. A 0.02s lint/type
#   failure therefore never dispatches (or waits on) the ~2-min GPU jobs.
#
# CONSUMER OVERRIDES — and a HARD REQUIREMENT about `piped`:
#   Override a nested job's glob/env/run by re-declaring it by name inside the
#   matching group; unset fields are preserved from here. BUT when a consumer
#   adds a `pre-commit:` override block, lefthook DROPS the remote hook's
#   top-level `piped: true` (verified 2.1.6) — so the consumer MUST re-declare
#   `piped: true` in its own `pre-commit:` block, or fail-fast silently breaks.
#   Likewise, only ONE override layer is safe: a second nested-job override
#   (e.g. a lefthook-local.yml also touching these jobs) leaks jobs to the top
#   level and breaks gating — keep ALL repo overrides in the committed
#   lefthook.yml. Example (wicketmap):
#     pre-commit:
#       piped: true            # REQUIRED — re-declare or fail-fast is lost
#       jobs:
#         - name: tier1-static
#           group:
#             jobs:
#               - name: ts-circular
#                 run: >- ...            # warn-only override
#         - name: tier2-gpu
#           group:
#             jobs:
#               - name: unit-tests
#                 glob: "..."            # widen/narrow trigger
#                 env: { SCI_WT: wicketmap }
#
# Requires ORG_HOOKS exported by the repo's rc: (lefthook-rc.sh).
# Required npm scripts in the consumer: type-check, knip.

pre-commit:
  # Fail-fast across tiers: a failure in tier1-static breaks the pipe and
  # tier2-gpu is skipped. See header — this is the ONLY working mechanism.
  piped: true
  jobs:
    # ── Tier 1 — fast, local, parallel. All must pass before Tier 2. ─────────
    - name: tier1-static
      group:
        parallel: true
        jobs:
          # hygiene + secrets (from lefthook-common.yml)
          - name: secrets
            run: gitleaks git --pre-commit --staged --redact --no-banner
          - name: large-files
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" large-files {staged_files}'
          - name: conflict-markers
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" conflict-markers {staged_files}'
          - name: eof-whitespace
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" eof-ws {staged_files}'
          # TypeScript static analysis (from profiles/ts.yml)
          - name: ts-format-lint
            glob: "*.{ts,tsx,js,jsx,mjs,cjs,json}"
            run: npx --no-install biome check --staged --no-errors-on-unmatched
          - name: ts-typecheck
            glob: "*.{ts,tsx,json}"
            run: npm run type-check
          - name: ts-deadcode
            glob: "*.{ts,tsx,json}"
            run: npm run knip
          # ts-circular: exit policy is env-parameterized so consumers can relax
          # it to warn-only WITHOUT overriding `run` — lefthook 2.1.6 does NOT
          # merge a consumer's `run` override into a remote nested job (only new
          # fields like `env` merge). A repo with pre-existing cycles sets
          #   env: { DPDM_CIRCULAR: "circular:0" }
          # on this job in its lefthook.yml. Default circular:1 = hard fail.
          - name: ts-circular
            glob: "*.{ts,tsx}"
            run: >-
              npx --no-install dpdm --no-warning --no-tree
              --exit-code "${DPDM_CIRCULAR:-circular:1}" "src/**/*.{ts,tsx}"
          - name: ts-dup-types
            glob: "*.{ts,tsx}"
            run: node "${ORG_HOOKS}/scripts/check-duplicate-types.mjs" src
          - name: ts-no-reexports
            glob: "*.{ts,tsx,js,jsx,mjs}"
            run: node "${ORG_HOOKS}/scripts/check-no-reexports.mjs" src
          - name: ts-size-cap
            glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" size-cap {staged_files}'
          - name: ts-test-size-cap
            glob: "*.{test,spec}.{ts,tsx,js,jsx}"
            run: '"${ORG_HOOKS}/scripts/hygiene.sh" test-size-cap {staged_files}'

    # ── Tier 2 — expensive GPU dispatch. Runs ONLY if Tier 1 fully passed. ───
    - name: tier2-gpu
      group:
        parallel: true
        jobs:
          # NOTE: no `glob:` here on purpose. lefthook 2.1.6 merges nested-group
          # jobs by name but keeps the FIRST-defined value of each field — so a
          # remote `glob:` would WIN over the consumer's and the consumer's would
          # be silently ignored (verified). By omitting glob here, the consumer's
          # glob (in its lefthook.yml override) is authoritative. A consumer that
          # pulls this profile MUST set unit-tests/e2e-tests globs, or these jobs
          # run on every commit. (run/env DO merge from the consumer; glob does not.)
          - name: unit-tests
            run: |
              SCI=/home/john/src/simple-ci/sci
              WT=${SCI_WT:-$(basename "$(git rev-parse --show-toplevel)")}
              if test -x "$SCI"; then
                # Let the repo prepare per-commit inputs (e.g. a changed-files manifest
                # to scope the test run) before the job is rsynced to the CI worktree.
                [ -x ci/before-test-push ] && ci/before-test-push
                job=$("$SCI" push "${WT}/ci/test") || exit 1
                echo "  unit queued ($job)"
                # If the commit is interrupted, kill the remote job immediately rather
                # than leaving it to run (and a later push to supersede it).
                trap '"$SCI" kill "$job" >/dev/null 2>&1 || true' INT TERM
                "$SCI" wait "$job"; rc=$?
                trap - INT TERM
                # Retrieve fresh lcov from the CI host before running the ratchet.
                # The ratchet must run here — after this sync — to check current coverage.
                LCOV=${COVERAGE_LCOV:-coverage/lcov.info}
                if ci_host=$("$SCI" host 2>/dev/null) && [ -n "$ci_host" ]; then
                  worktree=$("$SCI" path "$job" 2>/dev/null)
                  if [ -n "$worktree" ]; then
                    mkdir -p "$(dirname "$LCOV")"
                    scp -q "$ci_host:$worktree/$LCOV" "$LCOV" 2>/dev/null || true
                  fi
                fi
                # Run coverage ratchet inline against the just-retrieved lcov.
                BASELINE=${COVERAGE_BASELINE:-coverage-baseline.json}
                if [ -f "$BASELINE" ] && [ -f "$LCOV" ] && [ -n "${ORG_HOOKS:-}" ]; then
                  staged=$(git diff --cached --name-only --diff-filter=ACMR \
                    | grep -E '^src/.*\.(ts|tsx|js|jsx|mjs|cjs)$' \
                    | grep -Ev '(^src/test/|\.(test|spec)\.(ts|tsx|js|jsx|mjs|cjs)$)')
                  if [ -f "coverage-ratchet-exclude" ]; then
                    _excl=$(mktemp)
                    grep -v '^#' coverage-ratchet-exclude | grep -v '^[[:space:]]*$' > "$_excl"
                    staged=$(printf '%s\n' "$staged" | grep -vFf "$_excl")
                    rm -f "$_excl"
                  fi
                  if [ -n "$staged" ]; then
                    node "${ORG_HOOKS}/scripts/coverage-ratchet.mjs" \
                      --lcov "$LCOV" --baseline "$BASELINE" $staged || exit 1
                  fi
                fi
                exit $rc
              else
                npm run test:coverage
              fi
          # See unit-tests note: no `glob:` here so the consumer's glob wins.
          - name: e2e-tests
            run: |
              SCI=/home/john/src/simple-ci/sci
              WT=${SCI_WT:-$(basename "$(git rev-parse --show-toplevel)")}
              if test -x "$SCI"; then
                job=$("$SCI" push "${WT}/ci/e2e-smoke") || exit 1
                echo "  e2e  queued ($job)"
                # If the commit is interrupted, kill the remote job immediately.
                trap '"$SCI" kill "$job" >/dev/null 2>&1 || true' INT TERM
                "$SCI" wait "$job"; rc=$?
                trap - INT TERM
                # Retrieve fresh E2E lcov from the CI host before running the ratchet.
                E2E_LCOV=${COVERAGE_E2E_LCOV:-coverage/e2e/lcov.info}
                if ci_host=$("$SCI" host 2>/dev/null) && [ -n "$ci_host" ]; then
                  worktree=$("$SCI" path "$job" 2>/dev/null)
                  if [ -n "$worktree" ]; then
                    mkdir -p "$(dirname "$E2E_LCOV")"
                    scp -q "$ci_host:$worktree/$E2E_LCOV" "$E2E_LCOV" 2>/dev/null || true
                  fi
                fi
                # Run E2E coverage ratchet inline against the just-retrieved lcov.
                E2E_BASELINE=${COVERAGE_E2E_BASELINE:-coverage-e2e-baseline.json}
                if [ -f "$E2E_BASELINE" ] && [ -f "$E2E_LCOV" ] && [ -n "${ORG_HOOKS:-}" ]; then
                  staged=$(git diff --cached --name-only --diff-filter=ACMR \
                    | grep -E '^src/.*\.(ts|tsx)$' \
                    | grep -Ev '(^src/test/|\.(test|spec)\.(ts|tsx)$)')
                  if [ -f "coverage-e2e-ratchet-exclude" ]; then
                    _excl=$(mktemp)
                    grep -v '^#' coverage-e2e-ratchet-exclude | grep -v '^[[:space:]]*$' > "$_excl"
                    staged=$(printf '%s\n' "$staged" | grep -vFf "$_excl")
                    rm -f "$_excl"
                  fi
                  if [ -n "$staged" ]; then
                    node "${ORG_HOOKS}/scripts/coverage-ratchet.mjs" \
                      --lcov "$E2E_LCOV" --baseline "$E2E_BASELINE" $staged || exit 1
                  fi
                fi
                exit $rc
              else
                npm run test:e2e
              fi

# Linear-history guard (from lefthook-common.yml). Authoritative enforcement is
# server-side (GitHub Ruleset "require linear history"); this is fast local
# feedback. Kept here so a tiered repo needs only this one file.
pre-merge-commit:
  commands:
    no-merge-on-protected:
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" no-merge-commit'
