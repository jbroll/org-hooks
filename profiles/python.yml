# Python language pack.
# A repo opts in with:  extends: [profiles/python.yml]
#
# ruff is host-installed (format + lint + import-sort + security S-rules,
# replaces black/isort/flake8/pyupgrade/bandit). mypy/vulture/deptry are
# run via `uv tool run` so no repo-level install is required; a repo may
# instead pin them in its own dev extras and drop the `uv tool run`.
#
# 2026 notes: stay on mypy for gating prod code (ty still beta, pyrefly
# greenfield-only). deptry = unused/missing deps. import-linter for
# architecture/cycle contracts when a repo defines .importlinter.

pre-commit:
  commands:
    py-format:
      glob: "*.py"
      run: ruff format --check {staged_files}
    py-lint:
      glob: "*.py"
      run: ruff check {staged_files}

pre-push:
  parallel: true
  commands:
    # Scoped like the TS pack: a push with no .py (or no dep manifest
    # change, for py-deps) skips the command entirely — no mypy/vulture/
    # deptry cost on unrelated pushes.
    py-typecheck:
      glob: "*.py"
      run: uv tool run mypy .
    py-deadcode:
      glob: "*.py"
      run: uv tool run vulture . --min-confidence 80
    py-deps:
      glob: "*.{py,toml,txt}"
      run: uv tool run deptry .
    py-size-cap:
      glob: "*.py"
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" size-cap {push_files}'
