# TypeScript / JavaScript language pack.
# A repo opts in with:  extends: [profiles/ts.yml]
#
# All static-analysis checks run pre-commit so breakage is caught immediately.
# There is no pre-push section — repos that want a push safety net can add one
# in their own lefthook.yml.
#
# Convention — required npm scripts in each repo's package.json:
#   type-check   runs tsc --noEmit for ALL tsconfigs the project needs
#                (app, backend, tests, scripts, etc.). org-hooks calls this
#                script so each project controls which configs are checked.
#                Example: "tsc -p tsconfig.app.json && tsc -p tsconfig.backend.json"
#
#   knip         runs knip dead-code analysis with project-specific configuration.
#                Configure knip.json and/or knip flags in this script.
#                Example: "knip --no-progress" (with knip.json for ignore lists)
#
# Other tools are invoked via `npx --no-install` so each repo pins its own
# versions in package.json. Recommended devDeps:
#   @biomejs/biome  typescript  knip  dpdm
#
# Test-class commands (unit-tests, e2e-tests, …) are NOT defined here —
# they belong in the repo's committed lefthook.yml with project-specific
# globs and run commands. See examples/lefthook.stub.yml.

pre-commit:
  parallel: true
  commands:
    ts-format-lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json}"
      # Auto-fix (format + SAFE lint fixes) and re-stage, so a formatting-only
      # diff self-heals at commit time instead of failing the commit and bouncing
      # back to the author (or an agent) for a manual reformat + recommit. biome
      # --write applies only safe fixes; anything needing --unsafe still surfaces
      # as an error and blocks the commit.
      #
      # CAVEAT (parallel: true): this command WRITES while the read-only checks
      # (ts-typecheck/ts-deadcode/ts-circular/...) read the same tree. biome only
      # rewrites files that actually need formatting, so the common case (already-
      # formatted staged files) writes nothing and cannot race. In the rarer case
      # where a staged file is reformatted, a concurrent reader could see it mid-
      # write and fail THIS commit; a retry then passes (file is already
      # formatted) — strictly better than the previous guaranteed fail-and-bounce.
      run: npx --no-install biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    ts-typecheck:
      glob: "*.{ts,tsx,json}"
      run: npm run type-check
    ts-deadcode:
      glob: "*.{ts,tsx,json}"
      run: npm run knip
    ts-circular:
      glob: "*.{ts,tsx}"
      run: >-
        npx --no-install dpdm --no-warning --no-tree
        --exit-code circular:1 "src/**/*.{ts,tsx}"
    ts-dup-types:
      glob: "*.{ts,tsx}"
      run: node "${ORG_HOOKS}/scripts/check-duplicate-types.mjs" src
    ts-no-reexports:
      glob: "*.{ts,tsx,js,jsx,mjs}"
      run: node "${ORG_HOOKS}/scripts/check-no-reexports.mjs" src
    ts-jazz-waist:
      glob: "*.{ts,tsx,js,jsx,mjs}"
      run: node "${ORG_HOOKS}/scripts/check-jazz-value-import-ban.mjs" src
    ts-size-cap:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" size-cap {staged_files}'
    ts-test-size-cap:
      glob: "*.{test,spec}.{ts,tsx,js,jsx}"
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" test-size-cap {staged_files}'
