# TypeScript / JavaScript language pack.
# A repo opts in with:  extends: [profiles/ts.yml]
#
# All static-analysis checks run pre-commit so breakage is caught immediately.
# The same checks repeat pre-push as a safety net for commits made without
# hooks (e.g. from another machine or with --no-verify).
#
# Convention — required npm scripts in each repo's package.json:
#   type-check   runs tsc --noEmit for ALL tsconfigs the project needs
#                (app, backend, tests, scripts, etc.). org-hooks calls this
#                script so each project controls which configs are checked.
#                Example: "tsc -p tsconfig.app.json && tsc -p tsconfig.backend.json"
#
# Other tools are invoked via `npx --no-install` so each repo pins its own
# versions in package.json. Recommended devDeps:
#   @biomejs/biome  typescript  knip  dpdm
#
# Test-class commands (unit-tests, e2e-tests, …) are NOT defined here —
# they belong in the repo's committed lefthook.yml with project-specific
# globs and run commands. See examples/lefthook.stub.yml.

pre-commit:
  parallel: true
  commands:
    ts-format-lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json}"
      run: npx --no-install biome check --staged --no-errors-on-unmatched
    ts-typecheck:
      glob: "*.{ts,tsx,json}"
      run: npm run type-check
    ts-deadcode:
      glob: "*.{ts,tsx,json}"
      run: npx --no-install knip --no-progress
    ts-circular:
      glob: "*.{ts,tsx}"
      run: >-
        npx --no-install dpdm --no-warning --no-tree
        --exit-code circular:1 "src/**/*.{ts,tsx}"
    ts-dup-types:
      glob: "*.{ts,tsx}"
      run: node "${ORG_HOOKS}/scripts/check-duplicate-types.mjs" src
    ts-no-reexports:
      glob: "*.{ts,tsx,js,jsx,mjs}"
      run: node "${ORG_HOOKS}/scripts/check-no-reexports.mjs" src
    ts-size-cap:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" size-cap {staged_files}'

pre-push:
  parallel: true
  commands:
    ts-typecheck:
      glob: "*.{ts,tsx,json}"
      run: npm run type-check
    ts-deadcode:
      glob: "*.{ts,tsx,json}"
      run: npx --no-install knip --no-progress
    ts-circular:
      glob: "*.{ts,tsx}"
      run: >-
        npx --no-install dpdm --no-warning --no-tree
        --exit-code circular:1 "src/**/*.{ts,tsx}"
    ts-dup-types:
      glob: "*.{ts,tsx}"
      run: node "${ORG_HOOKS}/scripts/check-duplicate-types.mjs" src
    ts-no-reexports:
      glob: "*.{ts,tsx,js,jsx,mjs}"
      run: node "${ORG_HOOKS}/scripts/check-no-reexports.mjs" src
    ts-size-cap:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: '"${ORG_HOOKS}/scripts/hygiene.sh" size-cap {push_files}'
