# Optional static overflow, run on push (not every commit).
# Language-specific work lives in profiles/*.yml (a repo `extends:` the
# packs it needs). This file only holds language-agnostic push gates.
#
# Heavy test suites / coverage / e2e are intentionally NOT here: those
# run in CI, or — when dispatched to a remote GPU queue — belong in
# pre-commit (see examples/lefthook.stub.yml), where they gate every
# commit. Pre-push stays fast: local static analysis only.

pre-push:
  parallel: true
  commands:
    # Placeholder so the hook exists even with no language pack; real
    # work is contributed by profiles/ts.yml, profiles/python.yml, etc.
    noop:
      run: 'true'
