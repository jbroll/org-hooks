# Read by sci when it runs from this repo's root — the commit hook and a manual
# `sci push` both do. sci takes the first config it finds and does not merge, so
# this one sources the machine's config for the host settings (CI_HOSTS, CI_HOST,
# CI_REMOTE_SCRIPT, CI_SERVER_URL) instead of restating them here, keeping real
# host names out of the repo.
. "$HOME/.config/simple-ci.conf"

# ci/.changed-files is gitignored and `sci push` filters the overlay through
# .gitignore, so without this the manifest never reaches the host and the unit
# job passes having run nothing. The --include must precede the .gitignore
# filter, which is what CI_RSYNC_ARGS does.
CI_RSYNC_ARGS="--include=ci/.changed-files"
