# Copy this to a repo as `lefthook.yml`, then run `lefthook install`.
# This stub is the ONLY hook config a repo carries; everything else is
# pulled from the pinned org-hooks ref.
#
# Onboarding checklist (per repo, one at a time):
#   1. cp org-hooks/examples/lefthook.stub.yml <repo>/lefthook.yml
#   2. set `git_url:` and `ref:` to your org-hooks path and tag
#   3. create lefthook-rc.sh (see below) and update the path in `rc:`
#   4. choose the language profile(s) in `configs:` under `remotes:`
#   5. add profiles/sci.yml if the repo dispatches tests to simple-ci
#   6. define a `type-check` npm script covering all your tsconfigs
#   7. define a `knip` npm script (e.g. knip --no-progress --include files)
#   8. add recommended devDeps (TS: @biomejs/biome typescript knip dpdm)
#   9. override e2e-tests glob in pre-commit if E2E should only trigger on UI files
#  10. lefthook install
#  11. test: `lefthook run pre-commit` then a throwaway commit
#
# NOTE: hook-level `env:` and root-level `env:` are both invalid in lefthook v2.
# Use `rc:` (root-level) to source a shell file that exports ORG_HOOKS.
# The rc file is sourced by the installed hook script before lefthook runs,
# so ORG_HOOKS is available to all command subprocesses.
#
# Create lefthook-rc.sh alongside lefthook.yml:
#   #!/bin/sh
#   export ORG_HOOKS=/path/to/your/org-hooks   # must match git_url above
#   . "$ORG_HOOKS/rc.sh"                        # org-wide hook env defaults
#
# Sourcing rc.sh pulls org defaults (e.g. LEFTHOOK_OUTPUT, which quiets passing
# commands so a failure isn't buried). Each default uses := — override any by
# exporting it BEFORE the `. "$ORG_HOOKS/rc.sh"` line.
#
# For machines with a different org-hooks path, override rc: in a gitignored
# lefthook-local.yml pointing to a machine-local rc file.

remotes:
  - git_url: /home/john/src/org-hooks      # or git@github.com:org/org-hooks.git
    ref: v0.6.5                             # pin to a tag — bump deliberately
    configs:
      - lefthook-common.yml
      - profiles/ts.yml       # and/or profiles/python.yml, profiles/specs.yml
      # - profiles/sci.yml    # add if this repo dispatches tests to simple-ci

# Sources lefthook-rc.sh before every hook — sets ORG_HOOKS and any other
# machine-local env vars needed by org-hooks scripts.
# The ./ prefix is required: the generated hook runs under POSIX sh (dash on
# many distros), where `. lefthook-rc.sh` searches PATH (not cwd) and fails.
rc: ./lefthook-rc.sh

# ── Overrides ───────────────────────────────────────────────────────────────
#
# profiles/sci.yml provides unit-tests and e2e-tests with sci-or-fallback
# dispatch. The only repo-specific override needed is narrowing e2e-tests
# to frontend files so backend-only commits don't trigger E2E:
#
# pre-commit:
#   commands:
#     e2e-tests:
#       glob: "src/{components,views,plugins}/**/*.{ts,tsx,css}"
