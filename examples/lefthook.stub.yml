# Copy this to a repo as `lefthook.yml`, then run `lefthook install`.
# This stub is the ONLY hook config a repo carries; everything else is
# pulled from the pinned org-hooks ref.
#
# Onboarding checklist (per repo, one at a time):
#   1. cp org-hooks/examples/lefthook.stub.yml <repo>/lefthook.yml
#   2. set `git_url:` and `ref:` to your org-hooks path and tag
#   3. set `ORG_HOOKS:` in the env block to match git_url
#   4. choose the language profile(s) in `configs:` under `remotes:`
#   5. define a `type-check` npm script covering all your tsconfigs
#   6. add recommended devDeps (TS: @biomejs/biome typescript knip dpdm)
#   7. define test-class commands (see below)
#   8. lefthook install
#   9. test: `lefthook run pre-commit` then a throwaway commit

remotes:
  - git_url: /home/john/src/org-hooks      # or git@github.com:org/org-hooks.git
    ref: v0.6.0                             # pin to a tag — bump deliberately
    configs:
      - lefthook-common.yml
      - lefthook-push.yml
      - profiles/ts.yml       # and/or profiles/python.yml, profiles/specs.yml

# ORG_HOOKS must match git_url above so scripts resolve correctly.
# Hardcode it here — don't rely on shell env, which isn't set in IDEs or CI.
# Override in gitignored lefthook-local.yml if your checkout is elsewhere.
env:
  ORG_HOOKS: /home/john/src/org-hooks

# ── Test classes ────────────────────────────────────────────────────────────
#
# Define one command per test class. Each command has:
#   glob:  which staged file patterns trigger this class
#   run:   how to run the tests (local or GPU-dispatched)
#
# The glob means: if NO staged file matches, the command is skipped entirely.
# This is how "only run e2e when UI code changes" is expressed.
#
# Default run commands below assume standard npm scripts. On machines with a
# GPU queue (sci), override `run:` in a gitignored lefthook-local.yml to
# dispatch remotely instead of running locally.
#
# Example — a project with two test classes:
#
# pre-commit:
#   commands:
#     unit-tests:
#       glob: "*.{ts,tsx,js,jsx,json,css,html}"   # any code change
#       run: npm run test:coverage
#
#     e2e-tests:
#       glob: "src/{components,views,plugins}/**/*.{ts,tsx,css}"   # UI only
#       run: npm run test:e2e
#
# Machine-specific GPU override in gitignored lefthook-local.yml:
#
# pre-commit:
#   commands:
#     unit-tests:              # same name — lefthook deep-merges, glob is kept
#       run: |
#         SCI=/home/john/src/simple-ci/sci
#         WT=$(basename "$(git rev-parse --show-toplevel)")
#         job=$("$SCI" push "${WT}/ci/test") && "$SCI" wait "$job"
#     e2e-tests:
#       run: |
#         SCI=/home/john/src/simple-ci/sci
#         WT=$(basename "$(git rev-parse --show-toplevel)")
#         job=$("$SCI" push "${WT}/ci/e2e-smoke") && "$SCI" wait "$job"
